<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saha Asistanı</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide İkonları -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        input, select, textarea { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        /* Modal Arkaplanı */
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- YÜKLENİYOR EKRANI -->
    <div id="loading-screen" class="absolute inset-0 z-50 bg-slate-50 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-slate-500 font-medium">Uygulama yükleniyor...</p>
    </div>

    <!-- GİRİŞ / KAYIT EKRANI -->
    <div id="auth-screen" class="hidden absolute inset-0 z-[70] bg-slate-100 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-6 border border-slate-200">
            <div class="text-center mb-8">
                <!-- Giriş Ekranı Logosu -->
                <img src="logo.jpg" alt="SahaTek" class="h-20 w-auto mx-auto mb-2 object-contain rounded-2xl">
                <p id="auth-subtitle" class="text-sm text-slate-500 mt-1 font-medium">Sisteme giriş yapın</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 pl-1">Kullanıcı Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="text" id="auth-email" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all sm:text-sm" placeholder="Kullanıcı adınızı girin">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 pl-1">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="password" id="auth-password" required minlength="6" class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all sm:text-sm" placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-blue-600/20 transition-all focus:ring-4 focus:ring-blue-200 flex justify-center items-center">
                        Giriş Yap
                    </button>
                </div>
            </form>
            
            <!-- Hata Mesajı Alanı -->
            <div id="auth-error" class="hidden mt-4 p-3 bg-red-50 border border-red-100 rounded-xl text-center text-xs text-red-600 font-medium"></div>
        </div>
        <p class="text-xs text-slate-400 mt-6 flex items-center"><i data-lucide="lock" class="w-3 h-3 mr-1"></i> Uçtan uca şifrelenmiştir</p>
    </div>

    <!-- DÜZENLEME MODALI (Popup) -->
    <div id="edit-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center modal-overlay p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden transform transition-all">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                    <i data-lucide="edit" class="h-5 w-5 mr-2 text-blue-600"></i>
                    Kaydı Düzenle
                </h2>
                <button id="close-edit-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="overflow-y-auto p-5">
                <form id="edit-form" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Vaka Numarası</label>
                            <input type="text" id="edit-vakaNo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 text-slate-500" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tarih</label>
                            <input type="date" id="edit-tarih" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Müşteri / Lokasyon</label>
                        <input type="text" id="edit-musteri" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Yapılan İşlem / Açıklama</label>
                        <textarea id="edit-aciklama" required rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Evrak / Form No</label>
                            <input type="text" id="edit-evrakNo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">İşlem Durumu</label>
                            <select id="edit-durum" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                <option value="Tamamlandı">Tamamlandı</option>
                                <option value="Devam Ediyor">Devam Ediyor</option>
                                <option value="Bekliyor">Parça/Onay Bekliyor</option>
                                <option value="İptal">İptal (Lokasyonda)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="pt-4 flex space-x-3">
                        <button type="button" id="cancel-edit-btn" class="flex-1 bg-white border border-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-xl hover:bg-slate-50 transition-colors">Vazgeç</button>
                        <button type="submit" id="save-edit-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-blue-200 flex justify-center items-center">
                            Güncelle
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ANA UYGULAMA (Başlangıçta Gizli) -->
    <div id="app-container" class="hidden flex-col h-full">
        
        <!-- Üst Bilgi (Header) -->
        <header class="bg-slate-900 text-white shadow-lg pt-safe shrink-0 z-20 relative border-b border-slate-800">
            <div class="px-4 py-3 flex items-center justify-between">
                <div class="flex items-center">
                    <!-- Üst Menü Logosu -->
                    <img src="logo.jpg" alt="SahaTek" class="h-10 w-auto object-contain">
                </div>
                <div class="flex items-center space-x-3">
                    <div id="total-records-badge" class="text-[10px] sm:text-xs font-medium bg-slate-800 px-2 py-1.5 rounded-lg border border-slate-700">
                        Hesaplanıyor...
                    </div>
                    <!-- Çıkış Yap Butonu -->
                    <button id="logout-btn" class="bg-slate-800 hover:bg-red-500 text-white p-1.5 rounded-lg transition-colors border border-slate-700 hover:border-red-600 shadow-sm" title="Güvenli Çıkış">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Ana İçerik Alanı -->
        <main class="flex-1 overflow-y-auto pb-24 relative">
            
            <!-- 1. LİSTE SEKME İÇERİĞİ -->
            <div id="tab-list" class="p-4 space-y-4 max-w-3xl mx-auto block">
                <!-- Arama Çubuğu -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="text" id="search-input" class="block w-full pl-10 pr-10 py-3 border border-slate-200 rounded-xl leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm transition-shadow" placeholder="Vaka No, Evrak veya Müşteri Ara...">
                    <button id="clear-search-btn" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i data-lucide="x" class="h-5 w-5 text-slate-400 hover:text-slate-600"></i>
                    </button>
                </div>
                <!-- Kayıtların Listeleneceği Konteyner -->
                <div id="records-container" class="space-y-6"></div>
            </div>

            <!-- 2. YENİ EKLE SEKME İÇERİĞİ -->
            <div id="tab-add" class="p-4 max-w-3xl mx-auto hidden">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-5 py-4 border-b border-slate-200">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                            <i data-lucide="plus" class="h-5 w-5 mr-2 text-blue-600"></i>
                            Yeni İş Kaydı
                        </h2>
                    </div>
                    <form id="add-form" class="p-5 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Vaka Numarası</label>
                                <input type="text" id="vakaNo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Örn: VK-2023-1042">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Tarih</label>
                                <input type="date" id="tarih" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Müşteri / Lokasyon</label>
                            <input type="text" id="musteri" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Müşteri Adı veya Adres Özeti">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Yapılan İşlem / Açıklama</label>
                            <textarea id="aciklama" required rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none" placeholder="Sahada yapılan işlemleri detaylandırın..."></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Evrak / Form No (Opsiyonel)</label>
                                <input type="text" id="evrakNo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Servis Formu veya İrsaliye No">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">İşlem Durumu</label>
                                <select id="durum" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
                                    <option value="Tamamlandı">Tamamlandı</option>
                                    <option value="Devam Ediyor">Devam Ediyor</option>
                                    <option value="Bekliyor">Parça/Onay Bekliyor</option>
                                    <option value="İptal">İptal (Lokasyonda)</option>
                                </select>
                            </div>
                        </div>
                        <div class="pt-4">
                            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-blue-200 flex justify-center items-center">
                                <i data-lucide="check-circle" class="mr-2 h-5 w-5"></i> Kaydı Tamamla
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 3. İADE MODEMLER SEKME İÇERİĞİ -->
            <div id="tab-modems" class="p-4 max-w-3xl mx-auto hidden space-y-6">
                <!-- Modem Ekleme Formu -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-indigo-50 px-5 py-4 border-b border-indigo-100">
                        <h2 class="text-lg font-semibold text-indigo-800 flex items-center">
                            <i data-lucide="router" class="h-5 w-5 mr-2 text-indigo-600"></i>
                            İade/Değişim Modem Ekle
                        </h2>
                    </div>
                    <form id="modem-form" class="p-5 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kayıtlı Vaka Seçin</label>
                            <select id="modem-vaka-select" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                <option value="">Önce vaka seçiniz...</option>
                                <!-- JS ile Doldurulacak -->
                            </select>
                            <p class="text-[10px] text-slate-500 mt-1">* Modem eklemek için önce "Yeni Ekle" bölümünden o vakayı kaydetmiş olmanız gerekir.</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Modem Seri No / Barkod</label>
                                <input type="text" id="modem-seri" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-mono" placeholder="Örn: ZT123456789">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">İşlem Tipi</label>
                                <select id="modem-tip" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                    <option value="İade Alındı">İade Alındı</option>
                                    <option value="Değişim Yapıldı">Değişim Yapıldı</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1 flex items-center">
                                <i data-lucide="link" class="w-3.5 h-3.5 mr-1 text-slate-400"></i> Takip / Belge Linki (Opsiyonel)
                            </label>
                            <input type="text" id="modem-link" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Varsa fotoğraf veya kargo takip linki yapıştırın...">
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="modem-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-indigo-200 flex justify-center items-center">
                                <i data-lucide="save" class="mr-2 h-5 w-5"></i> Modemi Vakaya Ekle
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Eklenen Modemler Listesi -->
                <div>
                    <h3 class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wider pl-1">Son Eklenen Modemler</h3>
                    <div id="modems-container" class="space-y-3">
                        <!-- JS ile Doldurulacak -->
                    </div>
                </div>
            </div>

        </main>

        <!-- Alt Gezinme Çubuğu -->
        <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 shrink-0">
            <div class="flex justify-around">
                <button id="nav-btn-list" class="flex-1 flex flex-col items-center py-3 px-2 transition-colors text-blue-600">
                    <i data-lucide="calendar" class="h-6 w-6 mb-1 stroke-2"></i>
                    <span class="text-[10px] font-semibold uppercase tracking-wider">Günlük İşler</span>
                </button>
                <button id="nav-btn-add" class="flex-1 flex flex-col items-center py-3 px-2 transition-colors text-slate-500 hover:text-slate-900">
                    <i data-lucide="plus" class="h-6 w-6 mb-1 stroke-[1.5]"></i>
                    <span class="text-[10px] font-semibold uppercase tracking-wider">Yeni Ekle</span>
                </button>
                <button id="nav-btn-modems" class="flex-1 flex flex-col items-center py-3 px-2 transition-colors text-slate-500 hover:text-slate-900">
                    <i data-lucide="router" class="h-6 w-6 mb-1 stroke-[1.5]"></i>
                    <span class="text-[10px] font-semibold uppercase tracking-wider">İade Modem</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // DİKKAT: Sadece giriş fonksiyonları var, yeni hesap açma (createUser) tamamen silindi!
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Ayarları
        const myFirebaseConfig = {
            apiKey: "AIzaSyCX0GKxsXcZ6JElpPeDydoAJZlsZcL2Njs",
            authDomain: "teknofixsahatest.firebaseapp.com",
            projectId: "teknofixsahatest",
            storageBucket: "teknofixsahatest.firebasestorage.app",
            messagingSenderId: "56598029133",
            appId: "1:56598029133:web:3fed78e01fe7089c3c0d04"
        };

        const app = initializeApp(myFirebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "saha-ortak-havuz-1"; 

        // State
        let currentUser = null;
        let records = [];
        let searchTerm = '';
        let deletingId = null;
        let isLoginMode = true; // Giriş mi yoksa Kayıt modunda mı?

        // UI Elementleri
        const ui = {
            loadingScreen: document.getElementById('loading-screen'),
            appContainer: document.getElementById('app-container'),
            authScreen: document.getElementById('auth-screen'),
            
            // Auth Formu
            authForm: document.getElementById('auth-form'),
            authEmail: document.getElementById('auth-email'),
            authPassword: document.getElementById('auth-password'),
            authSubmitBtn: document.getElementById('auth-submit-btn'),
            authSubtitle: document.getElementById('auth-subtitle'),
            authError: document.getElementById('auth-error'),
            logoutBtn: document.getElementById('logout-btn'),

            // Sekmeler
            tabList: document.getElementById('tab-list'),
            tabAdd: document.getElementById('tab-add'),
            tabModems: document.getElementById('tab-modems'),
            navBtnList: document.getElementById('nav-btn-list'),
            navBtnAdd: document.getElementById('nav-btn-add'),
            navBtnModems: document.getElementById('nav-btn-modems'),
            
            // Liste
            recordsContainer: document.getElementById('records-container'),
            searchInput: document.getElementById('search-input'),
            clearSearchBtn: document.getElementById('clear-search-btn'),
            totalRecordsBadge: document.getElementById('total-records-badge'),
            
            // Yeni Ekle Formu
            addForm: document.getElementById('add-form'),
            submitBtn: document.getElementById('submit-btn'),
            inpVaka: document.getElementById('vakaNo'),
            inpTarih: document.getElementById('tarih'),
            inpMusteri: document.getElementById('musteri'),
            inpAciklama: document.getElementById('aciklama'),
            inpEvrak: document.getElementById('evrakNo'),
            inpDurum: document.getElementById('durum'),
            
            // Düzenleme Modalı
            editModal: document.getElementById('edit-modal'),
            closeEditModal: document.getElementById('close-edit-modal'),
            cancelEditBtn: document.getElementById('cancel-edit-btn'),
            editForm: document.getElementById('edit-form'),
            saveEditBtn: document.getElementById('save-edit-btn'),
            editId: document.getElementById('edit-id'),
            editVaka: document.getElementById('edit-vakaNo'),
            editTarih: document.getElementById('edit-tarih'),
            editMusteri: document.getElementById('edit-musteri'),
            editAciklama: document.getElementById('edit-aciklama'),
            editEvrak: document.getElementById('edit-evrakNo'),
            editDurum: document.getElementById('edit-durum'),

            // Modem Sekmesi
            modemForm: document.getElementById('modem-form'),
            modemSelect: document.getElementById('modem-vaka-select'),
            modemSeri: document.getElementById('modem-seri'),
            modemTip: document.getElementById('modem-tip'),
            modemLink: document.getElementById('modem-link'),
            modemSubmitBtn: document.getElementById('modem-submit-btn'),
            modemsContainer: document.getElementById('modems-container')
        };

        lucide.createIcons();
        ui.inpTarih.value = new Date().toISOString().split('T')[0];

        // --- 1. Yetkilendirme (Giriş / Çıkış) ---
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            ui.loadingScreen.classList.add('hidden');
            
            if (user) {
                // Kullanıcı giriş yaptıysa ana uygulamayı göster
                ui.authScreen.classList.add('hidden');
                ui.appContainer.classList.remove('hidden');
                ui.appContainer.classList.add('flex');
                fetchRecords(); // Verileri çekmeye başla
            } else {
                // Kullanıcı çıkış yaptıysa veya giriş yapmadıysa giriş ekranını göster
                ui.appContainer.classList.add('hidden');
                ui.appContainer.classList.remove('flex');
                ui.authScreen.classList.remove('hidden');
            }
        });

        ui.authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            ui.authError.classList.add('hidden');
            
            // Kullanıcı sadece "umutcant" yazacak.
            // Firebase e-posta zorunluluğu istiyor, bu yüzden arka planda gizlice @saha.com ekliyoruz.
            const username = ui.authEmail.value.trim();
            const email = username + "@saha.com";
            const password = ui.authPassword.value;
            
            const originalBtnText = ui.authSubmitBtn.innerHTML;
            ui.authSubmitBtn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';
            ui.authSubmitBtn.disabled = true;

            try {
                // Şifre veya isim ASLA kodun içinde eşleştirilmiyor, güvenlik Google'ın sunucusunda sağlanıyor.
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Auth hatası:", error);
                
                // Hatanın detayına göre Türkçe mesaj verme
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                     ui.authError.textContent = "Kullanıcı adı veya şifre hatalı!";
                } else {
                     ui.authError.textContent = "Giriş yapılamadı! (Bağlantınızı kontrol edin veya Sign-In methodunun açık olduğundan emin olun)";
                }

                ui.authError.classList.remove('hidden');
                
                ui.authSubmitBtn.innerHTML = originalBtnText;
                ui.authSubmitBtn.disabled = false;
            }
        });

        // Çıkış Yap Butonu
        ui.logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                // Çıkış başarılı olunca onAuthStateChanged otomatik tetiklenip giriş ekranına atar
            } catch (error) {
                alert("Çıkış yapılamadı: " + error.message);
            }
        });


        // --- 2. Veri Çekme (ORTAK HAVUZ) ---
        function fetchRecords() {
            if (!currentUser) return;
            const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri');
            
            onSnapshot(recordsRef, (snapshot) => {
                const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                records = data.sort((a, b) => b.createdAt - a.createdAt);
                
                // Aylık Aktif/Pasif Hesaplama
                const currentMonth = new Date().getMonth();
                const currentYear = new Date().getFullYear();
                let aktifCount = 0;
                let pasifCount = 0;

                records.forEach(r => {
                    if (r.tarih && r.tarih !== 'Tarihsiz') {
                        const rDate = new Date(r.tarih);
                        if (rDate.getMonth() === currentMonth && rDate.getFullYear() === currentYear) {
                            if (r.durum === 'Tamamlandı') aktifCount++;
                            if (r.durum === 'İptal') pasifCount++;
                        }
                    }
                });

                ui.totalRecordsBadge.innerHTML = `Aylık: <span class="text-emerald-300 font-bold ml-1">${aktifCount} Aktif</span> <span class="mx-1 text-blue-400/50">|</span> <span class="text-red-300 font-bold">${pasifCount} Pasif</span>`;
                
                renderRecords();
                populateModemSelect();
                renderModems();
            }, (error) => {
                console.error("Veri çekme hatası:", error);
                alert("Veriler çekilemedi! Hata: " + error.message);
            });
        }

        // --- 3. UI Yardımcı Fonksiyonları ---
        function switchTab(tabName) {
            // Tüm sekmeleri gizle
            ui.tabList.classList.add('hidden');
            ui.tabAdd.classList.add('hidden');
            ui.tabModems.classList.add('hidden');
            
            // İlgili sekmeyi göster
            if(tabName === 'list') ui.tabList.classList.remove('hidden');
            if(tabName === 'add') ui.tabAdd.classList.remove('hidden');
            if(tabName === 'modems') ui.tabModems.classList.remove('hidden');

            // Alt menü renk ve kalınlık ayarları
            const btns = [
                { el: ui.navBtnList, name: 'list' },
                { el: ui.navBtnAdd, name: 'add' },
                { el: ui.navBtnModems, name: 'modems' }
            ];

            btns.forEach(btn => {
                const icon = btn.el.querySelector('svg, i');
                if(btn.name === tabName) {
                    btn.el.classList.add('text-blue-600');
                    btn.el.classList.remove('text-slate-500');
                    if(icon) { icon.classList.remove('stroke-[1.5]'); icon.classList.add('stroke-2'); }
                } else {
                    btn.el.classList.remove('text-blue-600');
                    btn.el.classList.add('text-slate-500');
                    if(icon) { icon.classList.remove('stroke-2'); icon.classList.add('stroke-[1.5]'); }
                }
            });
        }

        function getStatusInfo(status) {
            switch(status) {
                case 'Tamamlandı': return { color: 'bg-emerald-100 text-emerald-800 border-emerald-200', icon: 'check-circle' };
                case 'Devam Ediyor': return { color: 'bg-blue-100 text-blue-800 border-blue-200', icon: 'activity' };
                case 'Bekliyor': return { color: 'bg-amber-100 text-amber-800 border-amber-200', icon: 'clock' };
                case 'İptal': return { color: 'bg-red-100 text-red-800 border-red-200', icon: 'x-circle' };
                default: return { color: 'bg-gray-100 text-gray-800 border-gray-200', icon: 'circle' };
            }
        }

        function formatDateLabel(dateString) {
            if (dateString === 'Tarihsiz') return dateString;
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return dateString; }
        }

        // Düzenleme Modalı Aç/Kapat
        function openEditModal(record) {
            ui.editId.value = record.id;
            ui.editVaka.value = record.vakaNo || '';
            ui.editTarih.value = record.tarih || '';
            ui.editMusteri.value = record.musteri || '';
            ui.editAciklama.value = record.aciklama || '';
            ui.editEvrak.value = record.evrakNo || '';
            ui.editDurum.value = record.durum || 'Tamamlandı';
            ui.editModal.classList.remove('hidden');
        }

        function closeEditModal() {
            ui.editModal.classList.add('hidden');
            ui.editForm.reset();
        }

        ui.closeEditModal.addEventListener('click', closeEditModal);
        ui.cancelEditBtn.addEventListener('click', closeEditModal);

        // Düzenlemeyi Kaydet
        ui.editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const originalBtnHtml = ui.saveEditBtn.innerHTML;
            ui.saveEditBtn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';
            ui.saveEditBtn.disabled = true;

            const id = ui.editId.value;
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri', id);
                await setDoc(docRef, {
                    tarih: ui.editTarih.value,
                    musteri: ui.editMusteri.value,
                    aciklama: ui.editAciklama.value,
                    evrakNo: ui.editEvrak.value,
                    durum: ui.editDurum.value
                }, { merge: true }); // Merge true sadece bu alanları günceller, diğerlerini bozmaz

                closeEditModal();
            } catch (error) {
                console.error("Güncelleme hatası:", error);
                alert("Güncellenemedi! Hata: " + error.message);
            } finally {
                ui.saveEditBtn.innerHTML = originalBtnHtml;
                ui.saveEditBtn.disabled = false;
            }
        });

        // --- 4. Render (Ana Liste Çizdirme) ---
        function renderRecords() {
            const filtered = records.filter(record => 
                (record.vakaNo && record.vakaNo.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (record.evrakNo && record.evrakNo.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (record.musteri && record.musteri.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const groups = {};
            filtered.forEach(record => {
                const date = record.tarih || 'Tarihsiz';
                if (!groups[date]) groups[date] = [];
                groups[date].push(record);
            });

            const groupedRecords = Object.keys(groups)
                .sort((a, b) => new Date(b) - new Date(a))
                .map(date => ({ date, records: groups[date] }));

            if (groupedRecords.length === 0) {
                ui.recordsContainer.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-slate-200 border-dashed">
                        <i data-lucide="file-text" class="h-12 w-12 text-slate-300 mx-auto mb-3"></i>
                        <h3 class="text-lg font-medium text-slate-900">Kayıt Bulunamadı</h3>
                        <p class="text-slate-500 mt-1">${searchTerm ? 'Aramanıza uygun kayıt yok.' : 'Henüz hiç iş kaydetmediniz.'}</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            let html = '';
            groupedRecords.forEach(group => {
                html += `
                    <div class="space-y-3">
                        <div class="sticky top-0 z-10 bg-slate-50/95 backdrop-blur py-2 border-b border-slate-200">
                            <h2 class="text-sm font-bold text-slate-700 flex items-center">
                                <i data-lucide="calendar" class="h-4 w-4 mr-2 text-blue-600"></i>
                                ${formatDateLabel(group.date)}
                                <span class="ml-2 text-xs font-normal text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full">${group.records.length} İşlem</span>
                            </h2>
                        </div>
                `;

                group.records.forEach(record => {
                    const statusInfo = getStatusInfo(record.durum);
                    const timeString = new Date(record.createdAt).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    
                    // İptal edilen kayıtlar için özel kırmızı tasarım kontrolü
                    const isIptal = record.durum === 'İptal';
                    const cardBg = isIptal ? 'bg-red-50/50' : 'bg-white';
                    const cardBorder = isIptal ? 'border-red-200' : 'border-slate-200';
                    const footerBg = isIptal ? 'bg-red-50' : 'bg-slate-50';
                    const footerBorder = isIptal ? 'border-red-100' : 'border-slate-100';
                    const textColor = isIptal ? 'text-red-900' : 'text-slate-800';
                    const descColor = isIptal ? 'text-red-700' : 'text-slate-600';
                    
                    html += `
                        <div class="${cardBg} rounded-xl shadow-sm border ${cardBorder} overflow-hidden transition-all hover:shadow-md">
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="flex items-center space-x-2">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold ${isIptal ? 'bg-red-100 text-red-800 border-red-200' : 'bg-slate-100 text-slate-800 border-slate-200'} border">
                                            Vaka: ${record.vakaNo || 'Belirtilmedi'}
                                        </span>
                                    </div>
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium border ${statusInfo.color}">
                                        <i data-lucide="${statusInfo.icon}" class="w-3.5 h-3.5 mr-1"></i>
                                        ${record.durum}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold ${textColor} mb-1 flex items-center">
                                    <i data-lucide="map-pin" class="w-4 h-4 ${isIptal ? 'text-red-400' : 'text-slate-400'} mr-1.5"></i>
                                    ${record.musteri || 'İsimsiz Müşteri/Lokasyon'}
                                </h3>
                                <p class="${descColor} text-sm mb-3 line-clamp-2">${record.aciklama}</p>

                                ${record.iadeModemNo ? `
                                <div class="bg-indigo-50 rounded p-2 mb-3 border border-indigo-100 flex items-center justify-between">
                                    <div class="flex items-center">
                                        <i data-lucide="router" class="w-4 h-4 text-indigo-500 mr-2"></i>
                                        <span class="text-xs text-indigo-700 font-medium">${record.iadeModemTip}:</span>
                                        <span class="text-xs font-mono font-bold text-slate-800 ml-1 bg-white px-1.5 py-0.5 rounded border border-indigo-200">${record.iadeModemNo}</span>
                                    </div>
                                    ${record.iadeModemLink ? `
                                        <a href="${record.iadeModemLink.startsWith('http') ? record.iadeModemLink : 'https://' + record.iadeModemLink}" target="_blank" class="text-[10px] bg-indigo-600 text-white px-2 py-1 rounded hover:bg-indigo-700 transition-colors flex items-center">
                                            Link <i data-lucide="external-link" class="w-3 h-3 ml-1"></i>
                                        </a>
                                    ` : ''}
                                </div>` : ''}

                                <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t ${footerBorder}">
                                    <div class="flex items-center text-xs text-slate-500">
                                        <i data-lucide="clock" class="w-3.5 h-3.5 mr-1.5"></i>
                                        ${timeString}
                                    </div>
                                    ${record.evrakNo ? `
                                    <div class="flex items-center text-xs text-slate-500 justify-end">
                                        <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1.5"></i>
                                        Evrak: ${record.evrakNo}
                                    </div>` : ''}
                                </div>
                            </div>
                            
                            <div class="${footerBg} px-3 py-2 flex justify-between items-center border-t ${footerBorder}">
                                <!-- Hızlı Durum Değiştirici (Tıkla ve Değiştir) -->
                                <select data-action="inline-status-change" data-id="${record.id}" class="text-xs font-bold px-2 py-1.5 rounded-lg border outline-none cursor-pointer shadow-sm transition-all ${record.durum === 'Tamamlandı' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (record.durum === 'İptal' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-white text-blue-700 border-blue-200')}">
                                    <option value="Tamamlandı" ${record.durum === 'Tamamlandı' ? 'selected' : ''}>✅ Aktif (Tamamlandı)</option>
                                    <option value="İptal" ${record.durum === 'İptal' ? 'selected' : ''}>❌ Pasif (İptal)</option>
                                    <option value="Bekliyor" ${record.durum === 'Bekliyor' ? 'selected' : ''}>⏳ Bekliyor</option>
                                    <option value="Devam Ediyor" ${record.durum === 'Devam Ediyor' ? 'selected' : ''}>🔄 Devam Ediyor</option>
                                </select>
                                
                                <div class="flex items-center space-x-1">
                                    <button data-action="edit-record" data-id="${record.id}" class="text-blue-600 hover:text-blue-800 flex items-center text-xs font-medium transition-colors px-2 py-1.5 rounded hover:bg-blue-50">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5 mr-1"></i> Düzenle
                                    </button>
                                    
                                    <div>
                                        ${deletingId === record.id ? `
                                            <div class="flex items-center space-x-2 bg-red-50 px-2 py-1 rounded-lg border border-red-100">
                                                <span class="text-[10px] text-red-600 font-bold">Sil?</span>
                                                <button data-action="cancel-delete" class="text-slate-500 hover:text-slate-700 text-[10px] font-medium px-1.5 py-1 rounded bg-white border border-slate-200 shadow-sm">Hayır</button>
                                                <button data-action="confirm-delete" data-id="${record.id}" class="text-white bg-red-500 hover:bg-red-600 text-[10px] font-medium px-1.5 py-1 rounded shadow-sm">Evet</button>
                                            </div>
                                        ` : `
                                            <button data-action="request-delete" data-id="${record.id}" class="text-red-500 hover:text-red-700 flex items-center text-xs font-medium transition-colors px-2 py-1.5 rounded hover:bg-red-50">
                                                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1"></i> Sil
                                            </button>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });

            ui.recordsContainer.innerHTML = html;
            lucide.createIcons();
        }

        // --- MODEM SEKME YARDIMCILARI ---
        function populateModemSelect() {
            let options = '<option value="">Önce vaka seçiniz...</option>';
            records.forEach(r => {
                if(r.vakaNo) {
                    options += `<option value="${r.id}">${r.vakaNo} - ${r.musteri} (${r.tarih})</option>`;
                }
            });
            ui.modemSelect.innerHTML = options;
        }

        function renderModems() {
            const modemsOnly = records.filter(r => r.iadeModemNo);
            
            if(modemsOnly.length === 0) {
                ui.modemsContainer.innerHTML = `<div class="text-xs text-slate-500 text-center py-4 bg-slate-100 rounded-lg">Henüz modem kaydı bulunmuyor.</div>`;
                return;
            }

            let html = '';
            modemsOnly.forEach(m => {
                html += `
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full ${m.iadeModemTip === 'İade Alındı' ? 'bg-orange-500' : 'bg-blue-500'}"></div>
                        <div class="pl-2">
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[10px] font-bold ${m.iadeModemTip === 'İade Alındı' ? 'text-orange-600 bg-orange-50' : 'text-blue-600 bg-blue-50'} px-2 py-0.5 rounded border ${m.iadeModemTip === 'İade Alındı' ? 'border-orange-200' : 'border-blue-200'}">${m.iadeModemTip}</span>
                                <span class="text-xs text-slate-400 font-mono">${m.tarih}</span>
                            </div>
                            <div class="font-mono font-bold text-slate-800 text-sm my-1">${m.iadeModemNo}</div>
                            <div class="text-xs text-slate-600 mb-2 flex items-center justify-between">
                                <span>Vaka: <span class="font-semibold">${m.vakaNo}</span></span>
                                ${m.iadeModemLink ? `
                                    <a href="${m.iadeModemLink.startsWith('http') ? m.iadeModemLink : 'https://' + m.iadeModemLink}" target="_blank" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded border border-slate-200 transition-colors flex items-center">
                                        Link <i data-lucide="external-link" class="w-3 h-3 ml-1"></i>
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            ui.modemsContainer.innerHTML = html;
            lucide.createIcons();
        }

        // --- 5. Olay Dinleyicileri ---
        ui.navBtnList.addEventListener('click', () => switchTab('list'));
        ui.navBtnAdd.addEventListener('click', () => switchTab('add'));
        ui.navBtnModems.addEventListener('click', () => switchTab('modems'));

        ui.searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            if (searchTerm) ui.clearSearchBtn.classList.remove('hidden');
            else ui.clearSearchBtn.classList.add('hidden');
            renderRecords();
        });

        ui.clearSearchBtn.addEventListener('click', () => {
            ui.searchInput.value = '';
            searchTerm = '';
            ui.clearSearchBtn.classList.add('hidden');
            renderRecords();
        });

        // 1. Yeni Vaka Formu Gönderme
        ui.addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const originalBtnHtml = ui.submitBtn.innerHTML;
            ui.submitBtn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';
            ui.submitBtn.disabled = true;

            try {
                const newId = Date.now().toString();
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri', newId);
                
                await setDoc(docRef, {
                    vakaNo: ui.inpVaka.value,
                    tarih: ui.inpTarih.value,
                    musteri: ui.inpMusteri.value,
                    aciklama: ui.inpAciklama.value,
                    evrakNo: ui.inpEvrak.value,
                    durum: ui.inpDurum.value,
                    createdAt: Date.now(),
                    createdBy: currentUser.uid
                });

                ui.addForm.reset();
                ui.inpTarih.value = new Date().toISOString().split('T')[0];
                switchTab('list');
                
            } catch (error) {
                console.error("Kaydetme hatası:", error);
                alert("Kaydedilemedi! Hata Detayı: " + error.message);
            } finally {
                ui.submitBtn.innerHTML = originalBtnHtml;
                ui.submitBtn.disabled = false;
                lucide.createIcons();
            }
        });

        // 2. İade Modem Formu Gönderme
        ui.modemForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const selectedId = ui.modemSelect.value;
            if(!selectedId) {
                alert("Lütfen önce bir vaka seçin!");
                return;
            }

            const originalBtnHtml = ui.modemSubmitBtn.innerHTML;
            ui.modemSubmitBtn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';
            ui.modemSubmitBtn.disabled = true;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri', selectedId);
                
                await setDoc(docRef, {
                    iadeModemNo: ui.modemSeri.value,
                    iadeModemTip: ui.modemTip.value,
                    iadeModemLink: ui.modemLink.value
                }, { merge: true });

                ui.modemSeri.value = '';
                ui.modemTip.value = 'İade Alındı';
                ui.modemLink.value = '';
                ui.modemSelect.value = '';
                
            } catch (error) {
                console.error("Modem ekleme hatası:", error);
                alert("Modem Eklenemedi! Hata Detayı: " + error.message);
            } finally {
                ui.modemSubmitBtn.innerHTML = originalBtnHtml;
                ui.modemSubmitBtn.disabled = false;
                lucide.createIcons();
            }
        });

        // Hızlı Durum Değiştirme (Açılır Menü)
        ui.recordsContainer.addEventListener('change', async (e) => {
            const select = e.target;
            if (select.dataset.action === 'inline-status-change') {
                if (!currentUser) return;
                const id = select.dataset.id;
                const newStatus = select.value;
                
                select.disabled = true;
                select.classList.add('opacity-50');

                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri', id);
                    await setDoc(docRef, { durum: newStatus }, { merge: true });
                } catch (error) {
                    console.error("Hızlı güncelleme hatası:", error);
                    alert("Güncellenemedi! Hata: " + error.message);
                    renderRecords(); 
                }
            }
        });

        // Tıklama İşlemleri (Silme, Düzenleme)
        ui.recordsContainer.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const action = btn.dataset.action;
            const id = btn.dataset.id;

            // Düzenleme Modalı Aç
            if (action === 'edit-record') {
                const record = records.find(r => r.id === id);
                if(record) openEditModal(record);
                return;
            }

            // Silme İşlemleri
            if (action === 'request-delete') {
                deletingId = id;
                renderRecords();
            } else if (action === 'cancel-delete') {
                deletingId = null;
                renderRecords();
            } else if (action === 'confirm-delete') {
                if (!currentUser) return;
                btn.innerHTML = '<div class="animate-spin rounded-full h-3 w-3 border-b-2 border-white"></div>';
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'saha_gorevleri', id));
                    deletingId = null;
                } catch (error) {
                    console.error("Silme hatası:", error);
                    alert("Silinemedi! Hata: " + error.message);
                    deletingId = null;
                    renderRecords();
                }
            }
        });
    </script>
</body>
</html>
